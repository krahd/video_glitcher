name: Build and export regression

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/safe-export-*'

permissions:
  contents: read

jobs:
  build-and-logic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and logic/packaging tests (no GUI claims)
        shell: bash
        run: bash scripts/check.sh

  encoded-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install encoder for disposable regression fixtures
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate imported Linux library links without changing vendored payloads
        run: python3 scripts/materialize_linux_runtime.py --destination dist/runtime-ci
      - name: Verify real output, no-clobber, cancellation and failures
        run: bash scripts/check.sh --with-ffmpeg
